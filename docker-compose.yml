version: '3.8'

services:
  # --- Databases ---
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=teamos
      - POSTGRES_USER=teamos_user
      - POSTGRES_PASSWORD=teamos_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamos_user -d teamos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MCP HTTP Gateway Sidecar ---
  mcp-gateway:
    build:
      context: ./mcp-gateway
    ports:
      - "9091:9091"   # GitHub
      - "9092:9092"   # Slack
      - "9093:9093"   # Trello
      - "9094:9094"   # Notion
      - "9095:9095"   # Google Drive
      - "9096:9096"   # Google Calendar
    env_file:
      - ./mcp-gateway/.env
    environment:
      - GATEWAY_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Application Services ---
  backend:
    build:
      context: ./backend
    command: daphne -b 0.0.0.0 -p 8000 teamos_project.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=prod_secret_key_here
      - DATABASE_URL=postgres://teamos_user:teamos_password@db:5432/teamos
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # MCP gateway base — backend replaces the host portion of each
      # MCPServerRegistration.url when running inside Docker
      - MCP_GATEWAY_BASE_URL=http://mcp-gateway
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A teamos_project worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://teamos_user:teamos_password@db:5432/teamos
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_GATEWAY_BASE_URL=http://mcp-gateway
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:

